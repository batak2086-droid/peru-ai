<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080811">
<title>PERU AI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="glow glow-red"></div>
<div class="glow glow-blue"></div>

<main class="app">
  <header class="topbar">
    <div class="logo">P<span>✦</span></div>
    <div class="brand">
      <h1>PERU <span>AI</span></h1>
      <p><i class="online"></i> PERSONAL AI ASSISTANT</p>
    </div>
    <button id="clearBtn" class="icon-btn" aria-label="Clear chat">↻</button>
  </header>

  <section class="welcome">
    <div class="orb"><span>✦</span></div>
    <div class="eyebrow">YOUR WORLD. YOUR AI.</div>
    <h2>Hey there,<br><span>I'm Peru.</span></h2>
    <p>Your personal AI companion.<br>Yahan se shuru karte hain. ✨</p>
  </section>

  <section class="suggestions">
    <button class="suggestion">✦ &nbsp; Tell me something interesting</button>
    <button class="suggestion">⌘ &nbsp; Help me with a task</button>
  </section>

  <section id="chat" class="chat" aria-live="polite"></section>

  <form id="chatForm" class="composer">
    <textarea id="message" rows="1" placeholder="Message Peru AI..." aria-label="Your message"></textarea>
    <div class="composer-bottom">
      <span class="hint">✦ &nbsp; MADE FOR YOU</span>
      <button id="sendBtn" type="submit" aria-label="Send message">↑</button>
    </div>
  </form>
  <footer>MADE WITH <span>♥</span> BY HARSH TIWARI</footer>
</main>
<script src="script.js"></script>
</body>
</html>
